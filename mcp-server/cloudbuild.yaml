# Publicación automática del MCP en Cloud Run (disparador de Cloud Build conectado a GitHub).
# Solo reemplaza la imagen: conserva variables, secretos y URL del servicio.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "mcp-server/Dockerfile", "-t", "${_IMAGE}", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_IMAGE}"]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args: ["run", "deploy", "odoo-mcp-vg", "--image", "${_IMAGE}", "--region", "us-central1", "--quiet"]
substitutions:
  _IMAGE: us-central1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/odoo-mcp-vg:${SHORT_SHA}
options:
  logging: CLOUD_LOGGING_ONLY
